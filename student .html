<style>
/* ===== CSS 變數 & 重置 ===== */
:root {
  --bg: #0f1117;
  --bg2: #181c27;
  --bg3: #1e2435;
  --border: #2a3047;
  --accent: #4f8ef7;
  --accent2: #7c3aed;
  --accent-green: #22c55e;
  --accent-yellow: #f59e0b;
  --accent-red: #ef4444;
  --text: #e8eaf0;
  --text2: #8892aa;
  --text3: #4a5568;
  --card: #161a28;
  --shadow: 0 4px 24px rgba(0,0,0,0.4);
  --radius: 14px;
  --radius-sm: 8px;
  --font-main: 'Noto Sans TC', sans-serif;
}

/* ===== 淺色模式 ===== */
body.light-mode {
  --bg: #f0f2f7;
  --bg2: #ffffff;
  --bg3: #e8ecf4;
  --border: #d0d7e8;
  --accent: #2563eb;
  --accent2: #7c3aed;
  --accent-green: #16a34a;
  --accent-yellow: #d97706;
  --accent-red: #dc2626;
  --text: #1a1d2e;
  --text2: #5a6380;
  --text3: #9aa3bb;
  --card: #ffffff;
  --shadow: 0 4px 24px rgba(0,0,0,0.08);
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: var(--font-main);
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  overflow-x: hidden;
}

/* ===== Google Font ===== */
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700;900&family=Space+Mono:wght@400;700&display=swap');

/* ===== 通用 ===== */
.hidden { display: none !important; }
button { cursor: pointer; font-family: var(--font-main); }
input, textarea, select { font-family: var(--font-main); }

.btn {
  padding: 10px 22px;
  border-radius: var(--radius-sm);
  border: none;
  font-size: 14px;
  font-weight: 500;
  transition: all 0.2s;
  display: inline-flex;
  align-items: center;
  gap: 6px;
}
.btn-primary { background: var(--accent); color: #fff; }
.btn-primary:hover { background: #3a7ae0; transform: translateY(-1px); box-shadow: 0 4px 16px rgba(79,142,247,0.4); }
.btn-secondary { background: var(--bg3); color: var(--text); border: 1px solid var(--border); }
.btn-secondary:hover { background: var(--border); }
.btn-success { background: var(--accent-green); color: #fff; }
.btn-success:hover { background: #16a34a; }
.btn-danger { background: var(--accent-red); color: #fff; }
.btn-danger:hover { background: #dc2626; }
.btn-purple { background: var(--accent2); color: #fff; }
.btn-purple:hover { background: #6d28d9; }
.btn-sm { padding: 6px 14px; font-size: 12px; }
.btn-lg { padding: 14px 32px; font-size: 16px; }

input[type="text"], input[type="password"], input[type="date"], input[type="number"],
select, textarea {
  background: var(--bg3);
  border: 1px solid var(--border);
  color: var(--text);
  border-radius: var(--radius-sm);
  padding: 10px 14px;
  font-size: 14px;
  width: 100%;
  outline: none;
  transition: border-color 0.2s;
}
input:focus, select:focus, textarea:focus { border-color: var(--accent); }
textarea { resize: vertical; min-height: 90px; }
label { font-size: 13px; color: var(--text2); margin-bottom: 5px; display: block; font-weight: 500; }

.form-group { margin-bottom: 16px; }
.form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
@media (max-width: 600px) { .form-row { grid-template-columns: 1fr; } }

.card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 22px;
  box-shadow: var(--shadow);
}

.badge {
  display: inline-flex;
  align-items: center;
  padding: 3px 10px;
  border-radius: 20px;
  font-size: 11px;
  font-weight: 600;
}
.badge-green { background: rgba(34,197,94,0.15); color: var(--accent-green); }
.badge-red { background: rgba(239,68,68,0.15); color: var(--accent-red); }
.badge-yellow { background: rgba(245,158,11,0.15); color: var(--accent-yellow); }
.badge-blue { background: rgba(79,142,247,0.15); color: var(--accent); }

/* ===== Toast ===== */
#toast {
  position: fixed; bottom: 24px; right: 24px;
  background: var(--bg3); border: 1px solid var(--border);
  padding: 14px 20px; border-radius: var(--radius-sm);
  font-size: 14px; z-index: 9999;
  transform: translateY(80px); opacity: 0;
  transition: all 0.3s; max-width: 320px;
  box-shadow: var(--shadow);
}
#toast.show { transform: translateY(0); opacity: 1; }
#toast.success { border-left: 4px solid var(--accent-green); }
#toast.error { border-left: 4px solid var(--accent-red); }
#toast.info { border-left: 4px solid var(--accent); }

/* ===== Loading ===== */
#loading-overlay {
  position: fixed; inset: 0;
  background: rgba(15,17,23,0.85);
  display: flex; align-items: center; justify-content: center;
  z-index: 9998; flex-direction: column; gap: 14px;
}
.spinner {
  width: 40px; height: 40px;
  border: 3px solid var(--border);
  border-top-color: var(--accent);
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }

/* ===== 登入頁 ===== */
#login-page {
  min-height: 100vh;
  display: flex; align-items: center; justify-content: center;
  background: radial-gradient(ellipse at 30% 20%, rgba(79,142,247,0.08) 0%, transparent 60%),
              radial-gradient(ellipse at 70% 80%, rgba(124,58,237,0.08) 0%, transparent 60%),
              var(--bg);
  padding: 20px;
}
.login-container {
  width: 100%; max-width: 420px;
}
.login-header {
  text-align: center; margin-bottom: 32px;
}
.login-logo {
  width: 64px; height: 64px;
  background: linear-gradient(135deg, var(--accent), var(--accent2));
  border-radius: 18px;
  display: flex; align-items: center; justify-content: center;
  font-size: 28px; margin: 0 auto 16px;
  box-shadow: 0 8px 32px rgba(79,142,247,0.3);
}
.login-header h1 { font-size: 22px; font-weight: 700; margin-bottom: 6px; }
.login-header p { color: var(--text2); font-size: 14px; }

.role-tabs {
  display: grid; grid-template-columns: 1fr 1fr;
  background: var(--bg3); border-radius: var(--radius-sm);
  padding: 4px; margin-bottom: 24px; gap: 4px;
}
.role-tab {
  padding: 10px; text-align: center; border-radius: 6px;
  border: none; background: transparent; color: var(--text2);
  font-size: 14px; font-weight: 500; cursor: pointer;
  transition: all 0.2s;
}
.role-tab.active {
  background: var(--accent); color: #fff;
  box-shadow: 0 2px 8px rgba(79,142,247,0.4);
}

/* ===== 主應用佈局 ===== */
#app { display: none; min-height: 100vh; }

/* 頂部 Header */
.top-header {
  background: var(--bg2);
  border-bottom: 1px solid var(--border);
  padding: 0 24px;
  height: 60px;
  display: flex; align-items: center; justify-content: space-between;
  position: sticky; top: 0; z-index: 100;
}
.header-left { display: flex; align-items: center; gap: 14px; }
.header-logo {
  width: 36px; height: 36px;
  background: linear-gradient(135deg, var(--accent), var(--accent2));
  border-radius: 10px;
  display: flex; align-items: center; justify-content: center;
  font-size: 16px;
}
.header-title { font-size: 15px; font-weight: 700; }
.header-subtitle { font-size: 11px; color: var(--text2); }
.header-right { display: flex; align-items: center; gap: 12px; }
.user-info { text-align: right; }
.user-name { font-size: 13px; font-weight: 600; }
.user-role { font-size: 11px; color: var(--text2); }

/* Sidebar + Main */
.app-body { display: flex; min-height: calc(100vh - 60px); }

.sidebar {
  width: 220px; min-width: 220px;
  background: var(--bg2);
  border-right: 1px solid var(--border);
  padding: 16px 12px;
  display: flex; flex-direction: column; gap: 4px;
}
.nav-item {
  display: flex; align-items: center; gap: 10px;
  padding: 10px 12px; border-radius: var(--radius-sm);
  border: none; background: transparent; color: var(--text2);
  font-size: 13px; font-weight: 500; cursor: pointer;
  transition: all 0.2s; width: 100%; text-align: left;
}
.nav-item:hover { background: var(--bg3); color: var(--text); }
.nav-item.active { background: rgba(79,142,247,0.12); color: var(--accent); }
.nav-item .icon { font-size: 16px; min-width: 20px; }
.nav-section { font-size: 10px; color: var(--text3); font-weight: 700; letter-spacing: 1px; text-transform: uppercase; padding: 10px 12px 4px; }

.main-content {
  flex: 1; padding: 28px;
  overflow-y: auto;
  max-width: 1200px;
}

/* 手機版 */
@media (max-width: 768px) {
  .sidebar { display: none; }
  .main-content { padding: 14px; padding-bottom: 80px; }
  .mobile-nav {
    position: fixed; bottom: 0; left: 0; right: 0;
    background: var(--bg2);
    border-top: 1px solid var(--border);
    display: flex; justify-content: space-around;
    padding: 8px 0 env(safe-area-inset-bottom, 12px); z-index: 100;
  }
  .mobile-nav-item {
    display: flex; flex-direction: column; align-items: center; gap: 3px;
    border: none; background: transparent; color: var(--text2);
    font-size: 11px; cursor: pointer; padding: 6px 10px; min-width: 48px;
  }
  .mobile-nav-item .icon { font-size: 22px; }
  .mobile-nav-item.active { color: var(--accent); }
  body { padding-bottom: 0; }
  /* 手機版雙欄改單欄 */
  .form-row { flex-direction: column; }
  .form-row .form-group { width: 100%; }
  /* 地點統計雙欄改單欄 */
  #stats-panel-location > div[style*="grid-template-columns:1fr 1fr"] {
    grid-template-columns: 1fr !important;
  }
  /* 匯出雙欄改單欄 */
  #page-t-export > div[style*="grid-template-columns:1fr 1fr"] {
    grid-template-columns: 1fr !important;
  }
  /* header 手機縮排 */
  .top-header { padding: 0 14px; }
  .header-title { font-size: 13px; }
  .header-subtitle { display: none; }
  .user-name { font-size: 12px; }
  .page-title { font-size: 17px; }
  /* 表格允許橫滑 */
  .table-wrap { -webkit-overflow-scrolling: touch; }
  /* 統計卡片緊湊 */
  .stats-grid { grid-template-columns: repeat(2, 1fr); gap: 10px; margin-bottom: 16px; }
  .stat-value { font-size: 22px; }
  .card { padding: 14px; }
  /* 按鈕手機放大 */
  .btn-lg { min-height: 48px; font-size: 15px; }
  /* 工作摘要在手機好點選 */
  .entry-item { padding: 10px; }
  .photo-thumb { width: 70px; height: 56px; }
  /* 地距計算結果 */
  .dist-result { font-size: 13px; }
}
@media (min-width: 769px) { .mobile-nav { display: none !important; } }

/* ===== 頁面通用標題 ===== */
.page-title {
  font-size: 20px; font-weight: 700; margin-bottom: 6px;
}
.page-subtitle { color: var(--text2); font-size: 13px; margin-bottom: 24px; }

/* ===== 統計卡片 ===== */
.stats-grid {
  display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
  gap: 14px; margin-bottom: 24px;
}
.stat-card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 18px;
}
.stat-label { font-size: 12px; color: var(--text2); margin-bottom: 8px; }
.stat-value { font-size: 28px; font-weight: 800; font-family: 'Space Mono', monospace; }
.stat-desc { font-size: 11px; color: var(--text2); margin-top: 4px; }

/* ===== 表格 ===== */
.table-wrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 13px; }
th {
  background: var(--bg3); color: var(--text2);
  padding: 10px 14px; text-align: left;
  font-size: 11px; font-weight: 600; letter-spacing: 0.5px;
  border-bottom: 1px solid var(--border);
}
td { padding: 12px 14px; border-bottom: 1px solid var(--border); vertical-align: middle; }
tr:hover td { background: rgba(255,255,255,0.02); }
tr:last-child td { border-bottom: none; }

/* ===== Modal ===== */
.modal-overlay {
  position: fixed; inset: 0;
  background: rgba(0,0,0,0.7);
  display: flex; align-items: center; justify-content: center;
  z-index: 500; padding: 20px;
  backdrop-filter: blur(4px);
}
.modal {
  background: var(--bg2);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  width: 100%; max-width: 620px;
  max-height: 90vh; overflow-y: auto;
  box-shadow: 0 20px 60px rgba(0,0,0,0.6);
}
.modal-header {
  padding: 20px 24px 0;
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 20px;
}
.modal-title { font-size: 17px; font-weight: 700; }
.modal-close {
  width: 32px; height: 32px; border-radius: 50%;
  border: 1px solid var(--border); background: var(--bg3);
  color: var(--text2); font-size: 18px; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  transition: all 0.2s;
}
.modal-close:hover { background: var(--accent-red); color: #fff; border-color: var(--accent-red); }
.modal-body { padding: 0 24px 24px; }

/* ===== 圓餅圖 / 長條 ===== */
.chart-bar-wrap { display: flex; flex-direction: column; gap: 10px; }
.chart-bar-item { display: flex; align-items: center; gap: 10px; }
.chart-bar-label { width: 80px; font-size: 12px; color: var(--text2); text-align: right; flex-shrink: 0; }
.chart-bar-track { flex: 1; height: 8px; background: var(--bg3); border-radius: 4px; overflow: hidden; }
.chart-bar-fill { height: 100%; border-radius: 4px; transition: width 0.8s cubic-bezier(0.34,1.56,0.64,1); }
.chart-bar-pct { width: 40px; font-size: 12px; color: var(--text2); font-family: 'Space Mono', monospace; }

/* ===== 月記卡片（學生端）===== */
.journal-card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 20px;
  margin-bottom: 14px;
  transition: border-color 0.2s;
}
.journal-card:hover { border-color: var(--accent); }
.journal-card-header {
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 12px;
}
.journal-month { font-size: 15px; font-weight: 700; }
.journal-meta { font-size: 12px; color: var(--text2); margin-bottom: 8px; }
.journal-entries { display: flex; flex-direction: column; gap: 10px; margin-top: 12px; }
.entry-item {
  background: var(--bg3); border-radius: var(--radius-sm);
  padding: 12px; border-left: 3px solid var(--accent);
}
.entry-date { font-size: 11px; color: var(--text2); margin-bottom: 4px; font-family: 'Space Mono', monospace; }
.entry-content { font-size: 13px; line-height: 1.6; }
.entry-photos { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
.entry-photo {
  width: 80px; height: 60px; object-fit: cover;
  border-radius: 6px; border: 1px solid var(--border);
  cursor: pointer;
}

/* ===== 距離計算 ===== */
.dist-result {
  display: inline-flex; align-items: center; gap: 6px;
  background: rgba(34,197,94,0.1); border: 1px solid rgba(34,197,94,0.3);
  border-radius: var(--radius-sm); padding: 6px 12px;
  font-size: 13px; color: var(--accent-green); margin-top: 6px;
}
.dist-calculating {
  color: var(--accent-yellow); font-size: 12px; margin-top: 6px;
}

/* ===== 繳交狀態格 ===== */
.submit-grid {
  display: grid;
  grid-template-columns: 140px repeat(auto-fill, minmax(70px, 1fr));
  gap: 6px; font-size: 12px;
}
.submit-grid-header { font-size: 11px; color: var(--text2); padding: 6px; text-align: center; font-weight: 600; }
.submit-cell {
  padding: 6px; text-align: center; border-radius: 6px;
  font-size: 11px; font-weight: 600;
}
.submit-cell.done { background: rgba(34,197,94,0.12); color: var(--accent-green); }
.submit-cell.miss { background: rgba(239,68,68,0.1); color: var(--accent-red); }
.submit-cell.late { background: rgba(245,158,11,0.12); color: var(--accent-yellow); }
.submit-cell.na { background: transparent; color: var(--text3); }

/* ===== 照片上傳區 ===== */
.photo-upload-area {
  border: 2px dashed var(--border);
  border-radius: var(--radius-sm);
  padding: 24px;
  text-align: center;
  cursor: pointer;
  transition: all 0.2s;
}
.photo-upload-area:hover, .photo-upload-area.dragover {
  border-color: var(--accent);
  background: rgba(79,142,247,0.04);
}
.photo-preview-grid { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
.photo-thumb-wrap { position: relative; }
.photo-thumb { width: 90px; height: 70px; object-fit: cover; border-radius: 6px; border: 1px solid var(--border); }
.photo-remove {
  position: absolute; top: -6px; right: -6px;
  width: 18px; height: 18px; border-radius: 50%;
  background: var(--accent-red); color: #fff;
  border: none; font-size: 11px; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
}

/* ===== 響應式補充 ===== */
@media (max-width: 600px) {
  .stats-grid { grid-template-columns: repeat(2, 1fr); }
  .form-row { grid-template-columns: 1fr; }
  table { font-size: 12px; }
  th, td { padding: 8px 10px; }
  /* 設定頁兩欄在手機變一欄 */
  #page-t-settings [style*="grid-template-columns:1fr 1fr"] { grid-template-columns: 1fr !important; }
}

/* ===== 統計 Tab ===== */
.stats-tab-bar { display:flex; border-bottom:2px solid var(--border); margin-bottom:20px; gap:0; }
.stats-tab {
  padding: 10px 22px; border: none; background: transparent;
  color: var(--text2); font-size: 14px; font-weight: 500; cursor: pointer;
  border-bottom: 3px solid transparent; margin-bottom: -2px;
  transition: all 0.2s; border-radius:0;
}
.stats-tab.active { color: var(--accent); border-bottom-color: var(--accent); font-weight:600; }
.stats-tab:hover:not(.active) { color:var(--text); background:var(--bg3); }

/* ===== Firebase 設定提示 ===== */
.config-banner {
  background: rgba(245,158,11,0.1);
  border: 1px solid rgba(245,158,11,0.3);
  border-radius: var(--radius-sm);
  padding: 14px 18px;
  font-size: 13px;
  line-height: 1.7;
  margin-bottom: 20px;
}
.config-banner strong { color: var(--accent-yellow); }
.config-code {
  background: var(--bg);
  border-radius: 6px;
  padding: 12px 14px;
  font-family: 'Space Mono', monospace;
  font-size: 12px;
  margin-top: 10px;
  overflow-x: auto;
  line-height: 1.6;
  border: 1px solid var(--border);
  color: #7dd3fc;
}

/* ===== 動畫 ===== */
@keyframes fadeIn { from { opacity:0; transform:translateY(10px); } to { opacity:1; transform:translateY(0); } }
.fade-in { animation: fadeIn 0.3s ease; }

/* 進度條 */
.progress-bar { background: var(--bg3); border-radius: 4px; height: 6px; overflow: hidden; }
.progress-fill { height: 100%; background: linear-gradient(90deg, var(--accent), var(--accent2)); border-radius: 4px; transition: width 0.6s ease; }

/* 空狀態 */
.empty-state {
  text-align: center; padding: 48px 20px;
  color: var(--text2);
}
.empty-state .icon { font-size: 48px; margin-bottom: 14px; }
.empty-state p { font-size: 14px; }
</style>
</head>
<body>

<!-- ==================== 登入頁 ==================== -->
<div id="login-page" style="display:flex">
  <div class="login-container">
    <div class="login-header">

<script>
// ============ 全域狀態 ============
let currentUser = null;
let db, firebase_funcs;

// ============ Google 登入（學生端）============
const SCHOOL_DOMAIN = 'tcivs.tc.edu.tw';

async function googleSignIn() {
  const btn = document.getElementById('google-signin-btn');
  btn.disabled = true; btn.textContent = '登入中...';
  try {
    const { auth, provider, signInWithPopup } = firebase_funcs;
    await signInWithPopup(auth, provider);
  } catch(e) {
    btn.disabled = false;
    btn.innerHTML = '<img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" style="width:20px;height:20px"> 用學校 Google 帳號登入';
    showLoginError(e.code === 'auth/popup-closed-by-user' ? '視窗已關閉，請再試一次' : '登入失敗：' + e.message);
  }
}

function showLoginError(msg) {
  const el = document.getElementById('login-error');
  if (el) { el.textContent = msg; el.style.display = 'block'; }
}

async function handleStudentAuth(user) {
  const email = user.email || '';
  if (!email.endsWith('@' + SCHOOL_DOMAIN)) {
    await firebase_funcs.signOut(firebase_funcs.auth);
    showLoginError('請使用學校 @' + SCHOOL_DOMAIN + ' 帳號登入');
    return;
  }
  const { collection, doc, getDoc, setDoc, getDocs, query, where } = firebase_funcs;

  // 1. 先查 studentBindings/{uid}
  let bindSnap = await getDoc(doc(db, 'studentBindings', user.uid));
  let binding = bindSnap.exists() ? bindSnap.data() : null;

  // 2. 若沒有，查 email key（老師預先建立的）
  if (!binding) {
    const emailKey = 'email:' + email;
    const emailSnap = await getDoc(doc(db, 'studentBindings', emailKey));
    if (emailSnap.exists()) {
      binding = emailSnap.data();
      // 升級：把 email key 改成 uid key
      await setDoc(doc(db, 'studentBindings', user.uid), { ...binding, uid: user.uid, pendingUid: false });
    }
  }

  if (!binding || !binding.seatNo) {
    await firebase_funcs.signOut(firebase_funcs.auth);
    document.getElementById('login-page').style.display = 'flex';
    document.getElementById('app').style.display = 'none';
    showLoginError('帳號尚未設定，請聯絡老師完成帳號綁定');
    return;
  }

  // 3. 取得學生資料
  const stuSnap = await getDoc(doc(db, 'students', binding.seatNo));
  const stuData = stuSnap.exists() ? stuSnap.data() : {};

  currentUser = {
    role: 'student',
    uid: user.uid,
    email,
    name: stuData.name || user.displayName || email,
    seatNo: binding.seatNo,
    company: stuData.company || '',
    birthday: stuData.birthday || '',
    studentId: stuData.studentId || ''
  };

  document.getElementById('login-page').style.display = 'none';
  document.getElementById('app').style.display = 'flex';
  document.getElementById('header-user-name').textContent = currentUser.name + ' (' + binding.seatNo + '號)';
  document.getElementById('header-user-role').textContent = '🎓 學生';
  showPage('s-dashboard');
}

async function logout() {
  if (!confirm('確定要登出嗎？')) return;
  await firebase_funcs.signOut(firebase_funcs.auth);
  location.reload();
}

<script>
// ============ 全域狀態 ============
let currentUser = null; // { role:'teacher'|'student', uid, name, seatNo, ... }
let db, firebase_funcs;

// ============ 深色/淺色切換 ============
function toggleTheme() {
  const isLight = document.body.classList.toggle('light-mode');
  const btn = document.getElementById('theme-toggle-btn');
  if (btn) btn.textContent = isLight ? '☀️' : '🌙';

}
// 頁面載入時套用儲存的主題

  if (localStorage.getItem('theme') === 'light') {
    document.body.classList.add('light-mode');
    document.addEventListener('DOMContentLoaded', () => {
      const btn = document.getElementById('theme-toggle-btn');
      if (btn) btn.textContent = '☀️';
    });
  }
})();

// 等 Firebase 模組載入
function waitForFirebase(cb) {
  if (window._firebase) {
    db = window._firebase.db;
    firebase_funcs = window._firebase;
    cb();
  } else {
    setTimeout(() => waitForFirebase(cb), 100);
  }
}

// ============ 學期工具 ============
function getSemesters(years = 5) {
  // 台灣學年度：第1學期 8月~1月，第2學期 2月~7月
  const sems = [];
  const now = new Date();
  const thisYear = now.getFullYear() - 1911; // 民國
  for (let y = thisYear; y >= thisYear - years; y--) {
    sems.push({ key: `${y}-1`, label: `${y}學年第1學期 (${y+1911}/8~${y+1912}/1)`, start: new Date(`${y+1911}-08-01`), end: new Date(`${y+1912}-01-31`) });
    sems.push({ key: `${y}-2`, label: `${y}學年第2學期 (${y+1912}/2~${y+1912}/7)`, start: new Date(`${y+1912}-02-01`), end: new Date(`${y+1912}-07-31`) });
  }
  return sems;
}

function getCurrentSemester() {
  const now = new Date();
  const m = now.getMonth() + 1;
  const y = now.getFullYear() - 1911;
  if (m >= 8) return `${y}-1`;
  if (m >= 2) return `${y-1}-2`;
  return `${y-1}-1`;
}

function populateSemesterSelects(...ids) {
  const sems = getSemesters();
  const cur = getCurrentSemester();
  ids.forEach(id => {
    const el = document.getElementById(id);
    if (!el) return;
    el.innerHTML = sems.map(s => `<option value="${s.key}" ${s.key===cur?'selected':''}>${s.label}</option>`).join('');
  });
}

function getSemesterMonths(semKey) {
  const [y, t] = semKey.split('-').map(Number);
  if (t === 1) return [8,9,10,11,12,1];
  return [2,3,4,5,6,7];
}

// 日期區間工具：解析 YYYYMMDD 或 YYYY-MM-DD 為 Date 物件
function parse8digit(s) {
  if (!s) return null;
  const digits = s.replace(/[-/]/g, '');
  if (digits.length < 8) return null;
  const y = parseInt(digits.substring(0,4));
  const m = parseInt(digits.substring(4,6)) - 1;
  const d = parseInt(digits.substring(6,8));
  const dt = new Date(y, m, d);
  return isNaN(dt.getTime()) ? null : dt;
}

// 任意日期字串 → YYYY-MM-DD（供 input[type=date] 使用）
function toDateVal(s) {
  if (!s) return '';
  const digits = s.replace(/[-/]/g, '');
  if (digits.length < 8) return s;
  return `${digits.slice(0,4)}-${digits.slice(4,6)}-${digits.slice(6,8)}`;
}

// 從 journal 的 semester + month 推算實際日曆月份（用於日期篩選）
function getJournalMonthDate(j) {
  const parts = (j.semester || '').split('-').map(Number);
  if (parts.length < 2) return null;
  const [y, t] = parts;
  const month = j.month || 1;
  // 第1學期：8-12月屬 y+1911 年，1月屬 y+1912 年
  // 第2學期：2-7月屬 y+1912 年
  const fullYear = (t === 1 && month !== 1) ? y + 1911 : y + 1912;
  return new Date(fullYear, month - 1, 1);
}

// 判斷 journal 月份是否在起訖範圍內
function journalMonthInRange(j, startStr, endStr) {
  if (!startStr || !endStr) return true;
  const s = parse8digit(startStr);
  const e = parse8digit(endStr);
  if (!s || !e) return true;
  const d = getJournalMonthDate(j);
  if (!d) return true;
  // 結束日設為該月最後一天
  const eEnd = new Date(e.getFullYear(), e.getMonth() + 1, 0, 23, 59, 59);
  return d >= s && d <= eEnd;
}

// 取得8碼日期區間內所有的 {year,month} 組合
function getMonthsInRange(startStr, endStr) {
  const s = parse8digit(startStr);
  const e = parse8digit(endStr);
  if (!s || !e || s > e) return [];
  const result = [];
  let y = s.getFullYear(), m = s.getMonth() + 1;
  const ey = e.getFullYear(), em = e.getMonth() + 1;
  while (y < ey || (y === ey && m <= em)) {
    result.push({ year: y, month: m });
    m++; if (m > 12) { m = 1; y++; }
  }
  return result;
}

// 判斷 journal 的 submittedAt 是否在日期區間內
function journalInRange(j, startStr, endStr) {
  const s = parse8digit(startStr);
  const eDate = parse8digit(endStr);
  if (!s || !eDate) return true; // 無效區間就全部顯示
  const eEnd = new Date(eDate.getFullYear(), eDate.getMonth(), eDate.getDate(), 23, 59, 59);
  const sub = j.submittedAt ? new Date(j.submittedAt) : null;
  if (!sub) return false;
  return sub >= s && sub <= eEnd;
}

// 讀取統計日期區間（從 input[type=date] 組成 YYYYMMDD 8碼字串）
function getStatsDateRange(_prefix) {
  const sv = document.getElementById('stats-date-start')?.value || '';
  const ev = document.getElementById('stats-date-end')?.value   || '';
  return {
    start: sv.replace(/-/g, ''),
    end:   ev.replace(/-/g, '')
  };
}

// ── Cloudinary 圖片上傳 ──
// 將壓縮後的 canvas 上傳至 Cloudinary，回傳圖片 URL
// 若設定未填或上傳失敗，自動 fallback 回傳 Base64（相容舊邏輯）
async function uploadToCloudinary(blob, folder) {
  if (!CLOUDINARY_CLOUD_NAME || CLOUDINARY_CLOUD_NAME.startsWith('請填') ||
      !CLOUDINARY_UPLOAD_PRESET || CLOUDINARY_UPLOAD_PRESET.startsWith('請填')) {
    // 未設定 Cloudinary，fallback 到 Base64
    return null;
  }
  try {
    const formData = new FormData();
    formData.append('file', blob);
    formData.append('upload_preset', CLOUDINARY_UPLOAD_PRESET);
    if (folder) formData.append('folder', folder);
    const res = await fetch(
      `https://api.cloudinary.com/v1_1/${CLOUDINARY_CLOUD_NAME}/image/upload`,
      { method: 'POST', body: formData }
    );
    if (!res.ok) throw new Error('Cloudinary 上傳失敗 ' + res.status);
    const data = await res.json();
    return data.secure_url; // https://res.cloudinary.com/...
  } catch(e) {
    console.warn('Cloudinary 上傳失敗：', e.message);
    // 顯示明確提示，讓學生知道圖片沒有上傳成功
    toast('⚠️ 圖片上傳失敗（改用本地儲存）\n若持續發生請通知老師，可能是儲存空間已滿', 'error');
    return null;
  }
}

// 將 canvas 轉成 Blob
function canvasToBlob(canvas, quality = 0.75) {
  return new Promise(resolve => canvas.toBlob(resolve, 'image/jpeg', quality));
}

// 統一的圖片來源處理：URL 或 Base64 都能當 <img src> 使用
function resolveImgSrc(src) {
  if (!src) return '';
  if (src.startsWith('http')) return src;
  if (src.startsWith('data:')) return src;
  return 'data:image/jpeg;base64,' + src;
}

function waitForFirebaseReady() {
  return new Promise(resolve => {
    function check() {
      if (window._firebase) {
        db = window._firebase.db;
        firebase_funcs = window._firebase;
        resolve();
      } else {
        setTimeout(check, 80);
      }
    }
    check();
  });
}

// ============ 學生登入 ============
async function studentLogin() {
  const seat = document.getElementById('student-seat').value.trim().padStart(2,'0');
  const bday = document.getElementById('student-birthday').value.trim();
  if (!seat || !bday) return toast('請填寫座號與生日', 'error');
  // 正規化日期格式，接受 2009/5/10 或 2009-5-10 或 20090510
  const normalBday = normalizeBirthday(bday);
  if (!normalBday) return toast('生日格式錯誤，請輸入如：2009/5/10', 'error');
  showLoading();
  try {
    const { doc, getDoc } = firebase_funcs;
    const snap = await getDoc(doc(db, 'students', seat));
    if (!snap.exists()) { hideLoading(); return toast('找不到此座號，請洽老師', 'error'); }
    const data = snap.data();
    if (data.birthday !== normalBday) { hideLoading(); return toast('生日驗證失敗，請重新確認', 'error'); }
    currentUser = { role: 'student', uid: seat, seatNo: seat, studentId: data.studentId, name: data.name, gender: data.gender || '', company: data.company };
    enterApp();
  } catch(e) {
    hideLoading();
    toast('登入錯誤：' + e.message, 'error');
  }
}

// 正規化生日：統一存為 YYYY/M/D
function normalizeBirthday(input) {
  const s = input.trim().replace(/-/g, '/');
  // 支援 2009/5/10、2009/05/10
  const m = s.match(/^(\d{4})\/(\d{1,2})\/(\d{1,2})$/);
  if (m) return `${m[1]}/${parseInt(m[2])}/${parseInt(m[3])}`;
  // 支援純數字 20090510
  const m2 = s.match(/^(\d{4})(\d{2})(\d{2})$/);
  if (m2) return `${m2[1]}/${parseInt(m2[2])}/${parseInt(m2[3])}`;
  return null;
}

// ---- 寫月記（學期從 deadlines 自動帶入）----
async function initWriteForm() {
  // 從 deadlines 取得有設定的學期清單，找「上傳中」或「即將開放」的
  const { collection, getDocs } = firebase_funcs;
  const snap = await getDocs(collection(db, 'deadlines'));
  const now = new Date();

  // 收集有效學期（已開放或未來 60 天內即將開放）
  const semMap = {}; // key -> { label, latestOpen }
  snap.docs.forEach(d => {
    const dd = d.data();
    const openDate = new Date(dd.openDate);
    const closeDate = new Date(dd.closeDate);
    const future60 = new Date(now.getTime() + 60 * 24 * 60 * 60 * 1000);
    // 包含：上傳中 或 尚未截止 或 未來60天將開放
    if (closeDate >= now || openDate <= future60) {
      if (!semMap[dd.semester]) {
        semMap[dd.semester] = { label: dd.semesterLabel || dd.semester, latestOpen: openDate };
      } else if (openDate > semMap[dd.semester].latestOpen) {
        semMap[dd.semester].latestOpen = openDate;
      }
    }
  });

  // 若 deadlines 沒資料，fallback 到當前學期
  const writeSemSel = document.getElementById('write-semester');
  const currentSem = getCurrentSemester();
  const sems = Object.keys(semMap);

  if (sems.length === 0) {
    // fallback：用 populateSemesterSelects
    populateSemesterSelects('write-semester');
  } else {
    // 依 latestOpen 時間排序（最新的在最前）
    sems.sort((a, b) => semMap[b].latestOpen - semMap[a].latestOpen);
    writeSemSel.innerHTML = sems.map(k =>
      `<option value="${k}">${semMap[k].label}</option>`
    ).join('');
    // 自動選最近開放的
    writeSemSel.value = sems[0];
  }

  initWriteMonths();
  const container = document.getElementById('work-entries-container');
  if (!container.children.length) addWorkEntry();
  checkMonthDeadline();
}

async function checkMonthDeadline() {
  const sem = document.getElementById('write-semester').value;
  const month = parseInt(document.getElementById('write-month').value);
  if (!sem || !month) return;

  const { doc, getDoc } = firebase_funcs;
  const snap = await getDoc(doc(db, 'deadlines', `${sem}-${month}`));
  const el = document.getElementById('write-deadline-status');
  if (!snap.exists()) {
    el.innerHTML = '<span class="badge badge-yellow">⚠️ 此月份尚未設定截止日期，仍可填寫</span>';
    return;
  }
  const d = snap.data();
  const now = new Date();
  const open = new Date(d.openDate);
  const close = new Date(d.closeDate);
  if (now < open) el.innerHTML = `<span class="badge badge-yellow">⏳ 開放日：${d.openDate}（尚未開放）</span>`;
  else if (now > close) el.innerHTML = `<span class="badge badge-red">🔒 已截止（${d.closeDate}）</span>`;
  else el.innerHTML = `<span class="badge badge-green">✅ 上傳中，截止日：${d.closeDate}</span>`;
}

// 日期自動格式化：輸入數字 → YYYY/MM/DD
function autoFormatDate(input) {
  let v = input.value.replace(/[^\d]/g, '').slice(0, 8);
  let formatted = v;
  if (v.length > 4) formatted = v.slice(0,4) + '/' + v.slice(4);
  if (v.length > 6) formatted = v.slice(0,4) + '/' + v.slice(4,6) + '/' + v.slice(6);
  input.value = formatted;
}

function stripNeighborhood(addr) {
  return addr
    .replace(/([縣市][^縣市]{1,8}[區鄉鎮市])[\u4e00-\u9fff]{1,8}[里村](?=[\u4e00-\u9fff]{1,12}(?:路|街|大道|巷|弄))/g, '$1')
    .replace(/[\u4e00-\u9fff]{1,8}[里村](?=[\u4e00-\u9fff]{1,12}(?:路|街|大道|巷|弄))/g, '');
}

// 完整地址前處理（組合使用）
function preprocessAddress(addr) {
  let a = normalizeTaiwanAddress(addr);
  a = stripPostalCode(a);
  a = stripNeighborhood(a);
  return a;
}

function parseTaiwanAddress(addr) {
  const clean = preprocessAddress(addr);
  const city = clean.match(/^(.+?[縣市])/i)?.[1] || '';
  let rest = city ? clean.slice(city.length) : clean;
  const district = rest.match(/^(.+?[區鄉鎮市])/i)?.[1] || '';
  if (district) rest = rest.slice(district.length);
  const street = rest || clean;
  const streetNo = street.match(/^(.+?[路街道巷弄][^,，]*)/)?.[1] || street;
  return { clean, city, district, street: streetNo };
}

function isTaiwanCoord(lat, lng) {
  return Number.isFinite(lat) && Number.isFinite(lng) && lat >= 21.5 && lat <= 25.5 && lng >= 119 && lng <= 122.5;
}

async function tryGeocodeUrl(url, parser) {
  const res = await fetch(url);
  if (!res.ok) return null;
  const data = await res.json();
  return parser(data);
}


function localKnownTaiwanPoint(cleanAddr) {
  const a = normalizeTaiwanAddress(cleanAddr);
  if ((a.includes('臺中市南區') || a.includes('台中市南區')) && a.includes('高工路191號')) {
    return { lat: SCHOOL_LAT, lng: SCHOOL_LNG };
  }
  if (a.includes('臺中工業高級中等學校') || a.includes('台中高工') || a.includes('臺中高工')) {
    return { lat: SCHOOL_LAT, lng: SCHOOL_LNG };
  }
  if ((a.includes('臺中市西區') || a.includes('台中市西區')) && a.includes('三民路一段199號')) {
    return { lat: 24.140226, lng: 120.67571 };
  }
  if (a.includes('臺中醫院') || a.includes('台中醫院')) {
    return { lat: 24.140226, lng: 120.67571 };
  }
  return null;
}
async function geocodeTaiwanAddress(addr) {
  const p = parseTaiwanAddress(addr);
  const localPoint = localKnownTaiwanPoint(p.clean);
  if (localPoint) return localPoint;
  const queries = [];
  const addNominatimStructured = (street) => {
    if (!street || !p.city) return;
    const qs = new URLSearchParams({ format: 'jsonv2', countrycodes: 'tw', limit: '1', street, city: p.city, country: 'Taiwan', 'accept-language': 'zh-TW' });
    queries.push({ url: `https://nominatim.openstreetmap.org/search?${qs.toString()}`, kind: 'nominatim' });
  };
  const addNominatimText = (q) => {
    const qs = new URLSearchParams({ format: 'jsonv2', countrycodes: 'tw', limit: '1', q, 'accept-language': 'zh-TW' });
    queries.push({ url: `https://nominatim.openstreetmap.org/search?${qs.toString()}`, kind: 'nominatim' });
  };
  const addPhotonText = (q) => {
    queries.push({ url: `https://photon.komoot.io/api/?q=${encodeURIComponent(q + ' 台灣')}&limit=1&lang=zh&bbox=119.0,21.5,122.5,25.5`, kind: 'photon' });
  };

  addNominatimStructured(p.street);
  addNominatimText(p.clean);
  if (p.city && p.district && p.street) addNominatimText(`${p.city}${p.district}${p.street}`);
  if (p.city && p.district && p.street) addNominatimText(`${p.city}${p.district}${p.street.replace(/\d+號.*$/, '')}`);
  addPhotonText(p.clean);
  if (p.city && p.district && p.street) addPhotonText(`${p.city}${p.district}${p.street.replace(/\d+號.*$/, '')}`);

  for (const q of queries) {
    try {
      const point = await tryGeocodeUrl(q.url, data => {
        if (q.kind === 'photon') {
          const first = data.features?.[0];
          if (!first) return null;
          const [lng, lat] = first.geometry.coordinates;
          return { lat: Number(lat), lng: Number(lng) };
        }
        const first = data?.[0];
        if (!first) return null;
        return { lat: Number(first.lat), lng: Number(first.lon) };
      });
      if (point && isTaiwanCoord(point.lat, point.lng)) return point;
    } catch(e) {}
  }
  return null;
}

function haversineKm(lat1, lng1, lat2, lng2) {
  const R = 6371;
  const dLat = (lat2-lat1) * Math.PI/180;
  const dLng = (lng2-lng1) * Math.PI/180;
  const a = Math.sin(dLat/2)**2 + Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dLng/2)**2;
  return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
}

function clearDistResult(id) {
  document.getElementById(`${id}-dist-result`).innerHTML = '';
  const manualInput = document.getElementById(`${id}-dist-manual`);
  if (manualInput) { manualInput.value = ''; manualInput.dataset.autoFilled = ''; }
}

async function calcDistance(id) {
  let addr = document.getElementById(`${id}-address`)?.value?.trim();
  if (!addr) return toast('請先輸入工作地點地址', 'error');
  const resultEl = document.getElementById(`${id}-dist-result`);
  resultEl.innerHTML = '<div class="dist-calculating">🔍 正在查詢地址，請稍候...</div>';

  try {
    const geoPoint = await geocodeTaiwanAddress(addr);
    if (!geoPoint) {
      resultEl.innerHTML = '<div class="dist-calculating" style="color:var(--accent-red)">❌ 找不到此地址，請確認地址是否正確</div>';
      return;
    }
    const destLat = geoPoint.lat;
    const destLng = geoPoint.lng;
    const directDistKm = haversineKm(SCHOOL_LAT, SCHOOL_LNG, destLat, destLng);
    if (directDistKm < 0.1) {
      resultEl.innerHTML = '<div class="dist-result">📍 距台中高工約 <strong>0.0 km</strong>（本校地址）</div>';
      return;
    }

    // Step 2：OSRM 計算開車距離與時間（免費、不需 API Key）；失敗時改用直線距離
    const osrmUrl = `https://router.project-osrm.org/route/v1/driving/${SCHOOL_LNG},${SCHOOL_LAT};${destLng},${destLat}?overview=false`;
    let osrmData = {};
    try {
      const osrmRes = await fetch(osrmUrl);
      osrmData = await osrmRes.json();
    } catch(routeErr) {
      osrmData = {};
    }

    let finalKm;
    if (osrmData.code === 'Ok' && osrmData.routes && osrmData.routes.length) {
      const route = osrmData.routes[0];
      finalKm = (route.distance / 1000).toFixed(1);
      const mins = Math.round(route.duration / 60);
      resultEl.innerHTML = `<div class="dist-result">🚗 距台中高工約 <strong>${finalKm} km</strong>，開車約 <strong>${mins} 分鐘</strong></div>`;
    } else {
      finalKm = haversineKm(SCHOOL_LAT, SCHOOL_LNG, destLat, destLng).toFixed(1);
      resultEl.innerHTML = `<div class="dist-result">📍 距台中高工約 <strong>${finalKm} km</strong>（直線距離）</div>`;
    }
    // 計算成功後預填距離值
    const manualInput = document.getElementById(`${id}-dist-manual`);
    if (manualInput && (manualInput.value === '' || manualInput.dataset.autoFilled === '1')) {
      manualInput.value = finalKm;
      manualInput.dataset.autoFilled = '1';
    }
  } catch(e) {
    resultEl.innerHTML = '<div class="dist-calculating" style="color:var(--accent-red)">❌ 查詢失敗，請確認網路連線</div>';
  }
}

function handlePhotoUpload(event, id) {
  const files = Array.from(event.target.files);
  const container = document.getElementById(`${id}-photos`);
  files.forEach(file => {
    const reader = new FileReader();
    reader.onload = async (e) => {
      const img = new Image();
      img.onload = async () => {
        // 壓縮圖片
        const canvas = document.createElement('canvas');
        const maxW = 800, maxH = 600;
        let w = img.width, h = img.height;
        if (w > maxW) { h = h * maxW / w; w = maxW; }
        if (h > maxH) { w = w * maxH / h; h = maxH; }
        canvas.width = w; canvas.height = h;
        canvas.getContext('2d').drawImage(img, 0, 0, w, h);

        // 先用 Base64 即時預覽
        const previewSrc = canvas.toDataURL('image/jpeg', 0.75);
        const wrap = document.createElement('div');
        wrap.className = 'photo-thumb-wrap';
        wrap.innerHTML = `
          <img src="${previewSrc}" class="photo-thumb">
          <button class="photo-remove" onclick="this.parentElement.remove()">×</button>
          <div class="photo-uploading" style="position:absolute;inset:0;background:rgba(0,0,0,0.45);display:flex;align-items:center;justify-content:center;border-radius:6px;font-size:10px;color:#fff">上傳中...</div>
        `;
        wrap.style.position = 'relative';
        container.appendChild(wrap);

        const imgEl = wrap.querySelector('img');

        // 嘗試上傳到 Cloudinary
        const folder = `tcivs/${currentUser?.seatNo || 'unknown'}`;
        const blob = await canvasToBlob(canvas, 0.75);
        const url = await uploadToCloudinary(blob, folder);

        // 移除上傳中提示
        wrap.querySelector('.photo-uploading')?.remove();

        if (url) {
          // 上傳成功：存 URL
          imgEl.src = url;
          imgEl.dataset.base64 = url;
          imgEl.onclick = () => openPhotoModal(url);
        } else {
          // fallback：存 Base64，縮圖加警示標記
          imgEl.dataset.base64 = previewSrc;
          imgEl.onclick = () => openPhotoModal(previewSrc);
          const warn = document.createElement('div');
          warn.title = '圖片未上傳至雲端，僅暫存本機';
          warn.style.cssText = 'position:absolute;top:2px;left:2px;background:#f97316;color:#fff;font-size:9px;padding:1px 4px;border-radius:3px;pointer-events:none';
          warn.textContent = '本機';
          wrap.appendChild(warn);
        }
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  });
}

async function saveJournal() {
  const sem = document.getElementById('write-semester').value;
  const month = parseInt(document.getElementById('write-month').value);
  const reflection = document.getElementById('write-reflection').value.trim();
  if (!reflection || reflection.length < 20) return toast('心得至少需要20字', 'error');

  const salary = parseInt(document.getElementById('write-salary').value) || null;
  const mentor = document.getElementById('write-mentor').value.trim();

  // 薪資單照片
  const salaryPhotoEl = document.getElementById('salary-photo-preview').querySelector('img');
  const salaryPhoto = salaryPhotoEl ? salaryPhotoEl.dataset.base64 : '';

  // 收集工作摘要
  const entries = [];
  let distanceError = false;
  document.querySelectorAll('#work-entries-container > div').forEach(div => {
    const id = div.id;
    const noPhoto = document.getElementById(`${id}-nophoto`)?.checked;
    const photos = noPhoto ? [] : Array.from(document.querySelectorAll(`#${id}-photos .photo-thumb-wrap img`)).map(img => img.dataset.base64);
    const address = document.getElementById(`${id}-address`)?.value?.trim() || '';
    const manualDistVal = document.getElementById(`${id}-dist-manual`)?.value?.trim();
    const distance = manualDistVal !== '' && manualDistVal != null ? parseFloat(manualDistVal) : null;
    // 有地址但距離空白 → 阻擋
    if (address && (distance === null || isNaN(distance))) {
      distanceError = true;
    }
    const typeEl = document.getElementById(`${id}-type`);
    let workType = typeEl ? typeEl.value : '';
    if (workType === '其他') {
      const otherInput = document.getElementById(`${id}-other-input`)?.value?.trim();
      if (otherInput) workType = `其他（${otherInput}）`;
    }
    entries.push({
      date: document.getElementById(`${id}-date`)?.value || '',
      type: workType,
      content: document.getElementById(`${id}-content`)?.value || '',
      address,
      distance,
      noPhoto: noPhoto || false,
      photos
    });
  });
  if (distanceError) return toast('有工作地點填了地址但尚未計算距離，請按「📍 計算距離」後再儲存', 'error');

  const data = {
    seatNo: currentUser.seatNo || '',
    studentId: currentUser.studentId || '',
    studentName: currentUser.name || '',
    company: currentUser.company || '',
    city: currentUser.city || '',
    semester: sem,
    month,
    salary: salary ?? null,
    mentor: mentor || '',
    salaryPhoto: salaryPhoto || '',
    reflection,
    entries: entries.map(e => ({
      date: e.date || '',
      type: e.type || '',
      content: e.content || '',
      address: e.address || '',
      distance: e.distance ?? null,
      noPhoto: e.noPhoto || false,
      photos: e.photos || []
    })),
    submittedAt: new Date().toISOString()
  };

  const dataJson = JSON.stringify(data);
  if (dataJson.length > 900000) {
    return toast('資料太大（照片過多或過大），請減少照片後再儲存', 'error');
  }

  // ── 防誤覆蓋：先查是否已有本月資料 ──
  showLoading();
  try {
    const { doc, getDoc, setDoc } = firebase_funcs;
    const journalRef = doc(db, 'journals', `${currentUser.seatNo}-${sem}-${month}`);
    const existing = await getDoc(journalRef);
    hideLoading();

    if (existing.exists()) {
      const existData = existing.data();
      const submittedDate = existData.submittedAt?.slice(0, 10) || '未知日期';
      const confirmed = window.confirm(
        `⚠️ 注意：${sem.replace('-1','第1學期').replace('-2','第2學期')} ${month}月份的月記已存在！\n` +
        `（原本繳交日期：${submittedDate}）\n\n` +
        `確定要覆蓋原本的資料嗎？`
      );
      if (!confirmed) {
        toast('已取消，原本月記保留', 'info');
        return;
      }
    }

    showLoading();
    await setDoc(journalRef, data);
    hideLoading();
    toast('月記已成功儲存！', 'success');
    showPage('s-dashboard');
  } catch(e) {
    hideLoading();
    console.error('儲存失敗:', e);
    toast('❌ 儲存失敗：' + (e.message || '請確認網路連線') + '\n若反覆失敗請通知老師（可能是系統額度已滿）', 'error');
  }
}

async function loadStudentHistory() {
  const startVal = document.getElementById('s-history-date-start')?.value || '';
  const endVal   = document.getElementById('s-history-date-end')?.value   || '';
  const startStr = startVal.replace(/-/g, '');
  const endStr   = endVal.replace(/-/g, '');
  const { collection, getDocs, query, where } = firebase_funcs;
  showLoading();
  const snap = await getDocs(query(collection(db, 'journals'), where('seatNo','==',currentUser.seatNo)));
  hideLoading();
  let journals = snap.docs.map(d => d.data());
  if (startStr && endStr) {
    journals = journals.filter(j => journalMonthInRange(j, startStr, endStr));
  }
  journals.sort((a,b) => (a.semester||'').localeCompare(b.semester||'') || (a.month||0)-(b.month||0));
  const container = document.getElementById('s-history-list');
  container.innerHTML = journals.length ? journals.map(j => renderJournalCard(j, false)).join('') :
    '<div class="empty-state"><div class="icon">📭</div><p>請選擇日期後按查詢，或無此期間月記</p></div>';
}

  const now = new Date();
  const y = now.getFullYear();
  const curMonth = now.getMonth() + 1;
  const isFirst = curMonth >= 8;
  const startStr = isFirst ? `${y}-08-01` : `${y}-02-01`;
  const endY = isFirst ? y + 1 : y;
  const endStr = isFirst ? `${endY}-01-31` : `${endY}-07-31`;
  // 所有日期起訖選擇器都套用本學期預設值
  const ids = [
    'stats-date-start','t-journals-date-start','export-date-start',
    's-history-date-start','s-export-date-start'
  ];
  const ide = [
    'stats-date-end','t-journals-date-end','export-date-end',
    's-history-date-end','s-export-date-end'
  ];
  ids.forEach(id => { const el = document.getElementById(id); if (el && !el.value) el.value = startStr; });
  ide.forEach(id => { const el = document.getElementById(id); if (el && !el.value) el.value = endStr; });
}

function confirmDeleteJournal(seatNo, semester, month, studentName, isTeacher) {
  const semLabel = semester.replace('-1','第1學期').replace('-2','第2學期');
  const who = isTeacher ? `${seatNo} ${studentName}` : '我的';
  document.getElementById('delete-journal-info').innerHTML =
    `👤 學生：<strong>${who}</strong><br>📅 學期：<strong>${semLabel}</strong><br>📆 月份：<strong>${month} 月</strong>`;
  const btn = document.getElementById('delete-journal-confirm-btn');
  btn.onclick = () => executeDeleteJournal(seatNo, semester, month, isTeacher);
  openModal('delete-journal-modal');
}

async function executeDeleteJournal(seatNo, semester, month, isTeacher) {
  const { doc, deleteDoc } = firebase_funcs;
  const docId = `${seatNo}-${semester}-${month}`;
  try {
    await deleteDoc(doc(db, 'journals', docId));
    closeModal('delete-journal-modal');
    toast('✅ 月記已刪除', 'success');
    // 刷新對應列表
    if (isTeacher) {
      loadTeacherJournals();
    } else {
      loadStudentHistory();
      loadStudentDashboard();
    }
  } catch(e) {
    toast('刪除失敗：' + e.message, 'error');
  }
}

function handleSalaryPhoto(event) {
  const file = event.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = async (e) => {
    const img = new Image();
    img.onload = async () => {
      const canvas = document.createElement('canvas');
      const maxW = 800, maxH = 600;
      let w = img.width, h = img.height;
      if (w > maxW) { h = h * maxW / w; w = maxW; }
      if (h > maxH) { w = w * maxH / h; h = maxH; }
      canvas.width = w; canvas.height = h;
      canvas.getContext('2d').drawImage(img, 0, 0, w, h);
      const previewSrc = canvas.toDataURL('image/jpeg', 0.75);

      const preview = document.getElementById('salary-photo-preview');
      preview.innerHTML = `
        <div style="position:relative;display:inline-block">
          <img id="salary-preview-img" src="${previewSrc}" data-base64="${previewSrc}"
            style="max-width:200px;max-height:140px;border-radius:6px;border:1px solid var(--border)">
          <button onclick="document.getElementById('salary-photo-preview').innerHTML=''"
            style="position:absolute;top:2px;right:2px;background:rgba(0,0,0,0.6);color:#fff;border:none;border-radius:50%;width:20px;height:20px;cursor:pointer;font-size:12px">×</button>
          <div id="salary-uploading" style="position:absolute;inset:0;background:rgba(0,0,0,0.45);display:flex;align-items:center;justify-content:center;border-radius:6px;font-size:10px;color:#fff">上傳中...</div>
        </div>`;

      // 嘗試上傳到 Cloudinary
      const folder = `tcivs/${currentUser?.seatNo || 'unknown'}/salary`;
      const blob = await canvasToBlob(canvas, 0.75);
      const url = await uploadToCloudinary(blob, folder);

      document.getElementById('salary-uploading')?.remove();
      const imgEl = document.getElementById('salary-preview-img');
      if (imgEl) {
        if (url) {
          imgEl.src = url;
          imgEl.dataset.base64 = url;
        }
        // fallback 已在 previewSrc 設好，不需額外處理
      }
    };
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
}

  document.getElementById('write-mentor').value = j.mentor || '';

      </div>`;
  }

  // 填工作摘要
  const container = document.getElementById('work-entries-container');

  (j.entries || []).forEach(e => {
    addWorkEntry();
    const id = `entry-${entryCount}`;
    document.getElementById(`${id}-date`).value = toDateVal(e.date || '');
    const typeEl = document.getElementById(`${id}-type`);
    if (typeEl) typeEl.value = e.type || '';
    document.getElementById(`${id}-address`).value = e.address || '';

    (a.seatNo+a.semester+String(a.month).padStart(2,'0')).localeCompare(b.seatNo+b.semester+String(b.month).padStart(2,'0'))

  let body = `<html><head><meta charset="UTF-8">

  body { font-family: '微軟正黑體', sans-serif; font-size: 11pt; margin: 1.5cm; line-height: 1.45; }

  sorted.forEach(j => {
    body += `<h2>📅 ${j.semester} 第 ${j.month} 月　${j.studentName || ''}（${j.seatNo}）</h2>`;
    body += `<table><tr>
      <th>座號</th><th>姓名</th><th>實習公司</th><th>縣市</th><th>學期</th><th>月份</th>
    </tr><tr>

      <td>${j.city||''}</td><td>${j.semester||''}</td><td>${j.month||''}月</td>
    </tr></table>`;

    if (j.salary) body += `<p><span class="label">本月薪資：</span>${j.salary.toLocaleString()} 元</p>`;

    (j.entries||[]).forEach((e, i) => {

function dataUrlToUint8Array(dataUrl) {
  const raw = dataUrl.includes(',') ? dataUrl.split(',')[1] : dataUrl;
  const binary = atob(raw.replace(/\s/g, ''));
  const bytes = new Uint8Array(binary.length);
  for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
  return bytes;
}

function loadImageElement(src) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.onload = () => resolve(img);
    img.onerror = () => reject(new Error('image load failed'));
    img.src = resolveImgSrc(src);
  });
}

async function makeDocxImageRun(D, base64, maxWidth, maxHeight) {
  const src = resolveImgSrc(base64);
  const img = await loadImageElement(src);
  const ratio = Math.min(maxWidth / img.naturalWidth, maxHeight / img.naturalHeight, 1);
  const width = Math.max(1, Math.round(img.naturalWidth * ratio));
  const height = Math.max(1, Math.round(img.naturalHeight * ratio));
  const canvas = document.createElement('canvas');
  canvas.width = width;
  canvas.height = height;
  const ctx = canvas.getContext('2d');
  ctx.fillStyle = '#ffffff';
  ctx.fillRect(0, 0, width, height);
  ctx.drawImage(img, 0, 0, width, height);
  const jpegDataUrl = canvas.toDataURL('image/jpeg', 0.88);
  // docx.js v8 transformation 單位為 EMU（9525 EMU = 1px @ 96dpi）
  return new D.ImageRun({
    type: 'jpg',
    data: dataUrlToUint8Array(jpegDataUrl),
    transformation: { width: Math.round(width * 9525), height: Math.round(height * 9525) }
  });
}

      // 工作摘要
      children.push(new D.Paragraph({
        children: [new D.TextRun({ text: `🔧 工作摘要（共 ${(j.entries||[]).length} 則）`, bold: true, size: 22, color: vs.accentColor, font: '微軟正黑體' })],
        spacing: { before: 200, after: 80 }
      }));

      for (let ei = 0; ei < (j.entries||[]).length; ei++) {
        const e = j.entries[ei];
        children.push(new D.Paragraph({
          children: [new D.TextRun({ text: `第 ${ei+1} 則　│　${e.date||'日期未填'}${e.type ? '　│　'+e.type : ''}`, bold: true, size: 20, font: '微軟正黑體', color: '2C3E60' })],
          spacing: { before: 120, after: 40 },
          border: { bottom: { style: D.BorderStyle.DASHED, size: 6, color: 'C0C8D8' } }
        }));
        if (e.address) {
          children.push(new D.Paragraph({
            children: [new D.TextRun({ text: `📍 工作地點：${e.address}${e.distance!=null?' （距學校約'+e.distance+' km）':''}`, size: 18, color: '667788', font: '微軟正黑體' })],
            spacing: { after: 40 }
          }));
        }
        const contentLines = (e.content||'（未填寫）').split('\n');
        contentLines.forEach(line => {
          children.push(new D.Paragraph({
            children: [new D.TextRun({ text: line, size: 22, font: '微軟正黑體' })],
            spacing: { after: 60 }
          }));
        });
        if (e.noPhoto) {
          children.push(new D.Paragraph({ children: [new D.TextRun({ text: '📵 此工作地點不便拍照', size: 18, color: '999999', italics: true, font: '微軟正黑體' })], spacing: { after: 40 } }));
        }
        // 工作照片
        for (const photoB64 of (e.photos||[])) {
          try {
            children.push(new D.Paragraph({
              children: [await makeDocxImageRun(D, photoB64, 320, 220)],
              spacing: { after: 80 }
            }));
          } catch(imgErr) { children.push(new D.Paragraph({ children: [new D.TextRun({ text: '（工作照片載入失敗）', size: 18, color: '999999', font: '微軟正黑體' })], spacing: { after: 80 } })); }
        }
        children.push(new D.Paragraph({ children: [new D.TextRun('')], spacing: { after: 60 } }));
      }
      if (!j.entries?.length) {
        children.push(new D.Paragraph({ children: [new D.TextRun({ text: '（本月無工作摘要）', size: 20, color: '999999', font: '微軟正黑體', italics: true })], spacing: { after: 100 } }));
      }
    }

    const doc = new D.Document({
      sections: [{ properties: { page: { margin: { top: 720, right: 900, bottom: 720, left: 900 } } }, children }]
    });

    const blob = await D.Packer.toBlob(doc);
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `${title}.docx`;
    a.click();
    URL.revokeObjectURL(url);
  } catch(err) {
    console.error(`Word ${version}版 產生失敗:`, err);
    toast(`${version}版產生失敗：${err.message}`, 'error');
  }
}
