name: 完整自動化測試（學生端 + 老師端 Canary）

# 三個觸發時機：
#   1. push 到 main：部署後幾分鐘內就知道有沒有壞掉
#   2. schedule：每天固定時間跑一次，就算當天沒有改動也會檢查
#   3. workflow_dispatch：在 GitHub 網頁上手動按按鈕就能立刻跑一次
on:
  push:
    branches: [main]
  schedule:
    - cron: '0 0 * * *'  # 每天 UTC 00:00（台北時間早上 8:00）
  workflow_dispatch: {}

jobs:
  canary:
    # ⚠️ 下面「XX 項 + YY 項」是純說明文字，不會自動跟著 tests/*.test.js 的實際測試數同步，
    #    每次 student.test.js 或 teacher.test.js 新增/刪除測試時記得手動改這裡
    #    （目前對應 2026-07-25：student.test.js 75 項〔71個具名呼叫點 + 4次頁籤切換迴圈，
    #     新增 S-SEC-40／S-SEC-41〕、teacher.test.js 70 項〔62個具名呼叫點 + 8次頁籤切換
    #     迴圈，新增 T-SEC-47〕，對應「7月截止日前只先寫1篇（規定2篇），8/1才補齊第2篇，
    #     算不算遲繳？」這個情境提問後發現並修正的「遲交」判斷邏輯缺口——原本
    #     teacher.html isJournalLate() 直接用 submittedAt（月記第一次存檔時間）比對截止
    #     日，但 submittedAt 只在第一次存檔時寫死、之後編輯永遠不變，會把「先隨便存一篇
    #     佔位」誤判成比「到期限後才第一次動手寫」更早繳交完成。修法新增
    #     entriesCompleteAt（篇數真正達到 minEntries 那一刻的時間），isJournalLate()
    #     改用 entriesCompleteAt || submittedAt 判斷；student.html 這部分的計算邏輯先
    #     從 saveJournal() 內部抽成獨立純函式 computeEntriesCompleteAt()（跟
    #     resolveMinEntries() 放在一起，行為完全不變，已用144組窮舉組合驗證新舊邏輯輸出
    #     一致）才能被 S-SEC-40 直接呼叫帶合成資料測試；S-SEC-41 驗證三處快取 fallback
    #     （checkMonthDeadline()／editJournal()／saveJournal() 自己的現查 fallback）皆
    #     補上 entriesCount／entriesCompleteAt，且 saveJournal() 送出的 payload 確實含
    #     這個欄位；T-SEC-47 直接呼叫 isJournalLate()／statusSymbolForJournal() 驗證
    #     entriesCompleteAt 優先於 submittedAt、缺欄位時正確退回 submittedAt，並確認
    #     isJournalComplete()／statusSymbolForJournal() 的既有判斷順序未被牽動。這輪
    #     另外同步新增 rule.txt 對 entriesCompleteAt 的格式驗證（獨立函式
    #     validEntriesCompleteAt()，比照 validFcmTokenWrite() 的既有模式）與
    #     test-rules.js 對應的 9 條規則層回歸測試（111→120），完整技術細節見
    #     AI_CONTEXT.md／AI_測試架構說明.md 對應更新。
    #     此數字已連續在 2026-06-24／2026-07-03／2026-07-15／2026-07-18／2026-07-23
    #     過期五次，這是第六次，見 AI_推播系統說明.md 第六節 #9、AI_測試架構說明.md
    #     第四節陷阱17，之後新增/刪除測試時務必記得回來改這一行）。
    name: 完整自動化測試（學生端 75 項 + 老師端 70 項）
    runs-on: ubuntu-latest
    steps:
      - name: 取得程式碼
        uses: actions/checkout@v4

      - name: 安裝 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 安裝測試套件相依套件
        working-directory: test-suite
        run: npm ci

      - name: 安裝 Playwright 瀏覽器（Chromium）
        working-directory: test-suite
        run: npx playwright install --with-deps chromium

      - name: 執行完整自動化測試（學生端 + 老師端，直接打正式環境）
        working-directory: test-suite
        env:
          FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
          TEST_STUDENT_EMAIL: ${{ secrets.TEST_STUDENT_EMAIL }}
          TEST_STUDENT_PASSWORD: ${{ secrets.TEST_STUDENT_PASSWORD }}
          TEST_TEACHER_EMAIL: ${{ secrets.TEST_TEACHER_EMAIL }}
          TEST_TEACHER_PASSWORD: ${{ secrets.TEST_TEACHER_PASSWORD }}
          HEADLESS: 'true'
        run: node run-tests.js

      - name: 上傳測試報告與失敗截圖（無論成功或失敗都保留）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: canary-report-${{ github.run_number }}
          path: |
            test-suite/test-report.txt
            test-suite/screenshots/
          retention-days: 14

      - name: 測試失敗時推送 Discord 通知
        if: failure()
        working-directory: test-suite
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: node notify-discord.js
