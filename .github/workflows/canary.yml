name: 完整自動化測試（學生端 + 老師端 Canary）

# 三個觸發時機：
#   1. push 到 main：部署後幾分鐘內就知道有沒有壞掉
#   2. schedule：每天固定時間跑一次，就算當天沒有改動也會檢查
#   3. workflow_dispatch：在 GitHub 網頁上手動按按鈕就能立刻跑一次
on:
  push:
    branches: [main]
  schedule:
    - cron: '0 0 * * *'  # 每天 UTC 00:00（台北時間早上 8:00）
  workflow_dispatch: {}

jobs:
  canary:
    # ⚠️ 下面「XX 項 + YY 項」是純說明文字，不會自動跟著 tests/*.test.js 的實際測試數同步，
    #    每次 student.test.js 或 teacher.test.js 新增/刪除測試時記得手動改這裡
    #    （目前對應 2026-08-11：teacher.test.js v28→v29（72→74 項，64→66個具名呼叫點 +
    #     8次頁籤切換迴圈，新增 T-SEC-50／T-SEC-51；student.test.js 本輪未變動，維持
    #     v28／77項），對應「薪資缺漏」新增依月份分組＋複製功能，分兩輪完成：①新增
    #     computeSalaryMissingGroups()（依真正的西元年月分組，避免查詢區間橫跨學年時
    #     同一個月份數字被誤合併）、renderSalaryMissingGroupedHtml()（月份標題列＋加粗
    #     分隔線）、copySalaryMissingList()（比照 copyOverdueList()，只複製座號、可篩選
    #     單一月份或全部），「薪資缺漏」box 拆成獨立整行卡片；②使用者確認後追加：三個
    #     清單改固定等寬三欄（.salary-alert-grid，純CSS，未新增對應測試，列為已知缺口）、
    #     「薪資缺漏」搬到最上層獨立整行、排序方向從「舊到新」改成「新到舊」。過程中連帶
    #     修正 T-SEC-43（regression fix，非新發現問題）——這條測試原本檢查
    #     renderSalaryAlerts.toString() 裡有沒有呼叫 getJournalCompany()，但這段邏輯第
    #     一輪重構時已搬進新的 computeSalaryMissingGroups()，導致 T-SEC-43 在正式環境
    #     真的跑出失敗（2026-08-11 test-report.txt：老師端 71/72），已將檢查目標同步
    #     改過去，getJournalCompany() 邏輯本身從頭到尾正確無誤。完整技術細節見
    #     AI_CONTEXT.md／AI_測試架構說明.md 對應更新。
    #     此數字已連續在 2026-06-24／2026-07-03／2026-07-15／2026-07-18／2026-07-23／
    #     2026-07-25／2026-08-05 過期七次，2026-08-08 第八次，這是第九次，見
    #     AI_推播系統說明.md 第六節 #9、AI_測試架構說明.md 第四節陷阱17，之後新增/刪除
    #     測試時務必記得回來改這一行）。
    name: 完整自動化測試（學生端 77 項 + 老師端 74 項）
    runs-on: ubuntu-latest
    steps:
      - name: 取得程式碼
        uses: actions/checkout@v4

      - name: 安裝 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 安裝測試套件相依套件
        working-directory: test-suite
        run: npm ci

      - name: 安裝 Playwright 瀏覽器（Chromium）
        working-directory: test-suite
        run: npx playwright install --with-deps chromium

      - name: 執行完整自動化測試（學生端 + 老師端，直接打正式環境）
        working-directory: test-suite
        env:
          FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
          TEST_STUDENT_EMAIL: ${{ secrets.TEST_STUDENT_EMAIL }}
          TEST_STUDENT_PASSWORD: ${{ secrets.TEST_STUDENT_PASSWORD }}
          TEST_TEACHER_EMAIL: ${{ secrets.TEST_TEACHER_EMAIL }}
          TEST_TEACHER_PASSWORD: ${{ secrets.TEST_TEACHER_PASSWORD }}
          HEADLESS: 'true'
        run: node run-tests.js

      - name: 上傳測試報告與失敗截圖（無論成功或失敗都保留）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: canary-report-${{ github.run_number }}
          path: |
            test-suite/test-report.txt
            test-suite/screenshots/
          retention-days: 14

      - name: 測試失敗時推送 Discord 通知
        if: failure()
        working-directory: test-suite
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: node notify-discord.js
