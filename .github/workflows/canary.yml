name: 完整自動化測試（學生端 + 老師端 Canary）

# 三個觸發時機：
#   1. push 到 main：部署後幾分鐘內就知道有沒有壞掉
#   2. schedule：每天固定時間跑一次，就算當天沒有改動也會檢查
#   3. workflow_dispatch：在 GitHub 網頁上手動按按鈕就能立刻跑一次
on:
  push:
    branches: [main]
  schedule:
    - cron: '0 0 * * *'  # 每天 UTC 00:00（台北時間早上 8:00）
  workflow_dispatch: {}

jobs:
  canary:
    # ⚠️ 下面「XX 項 + YY 項」是純說明文字，不會自動跟著 tests/*.test.js 的實際測試數同步，
    #    每次 student.test.js 或 teacher.test.js 新增/刪除測試時記得手動改這裡
    #    （目前對應 2026-07-18：student.test.js 72 項〔68個具名呼叫點 + 4次頁籤切換迴圈，
    #     新增 S-SEC-38，補齊 push-enable-modal（#push-enable-modal／
    #     maybeShowPushEnableModal()／enablePushFromModal()）先前完全零測試覆蓋的缺口，
    #     同時驗證 maybeShowPushEnableModal() 新補的登入狀態守門〕、teacher.test.js 65 項
    #     〔57個具名呼叫點 + 8次頁籤切換迴圈，新增對稱的 T-SEC-42〕。本機終端機截圖已確認
    #     137/137 全過（學生端72/72、老師端65/65，含 T-SEC-42 正確通過）。
    #     此數字已連續在 2026-06-24／2026-07-03／2026-07-15／2026-07-18 過期四次，見
    #     AI_推播系統說明.md 第六節 #9、AI_測試架構說明.md 第四節陷阱17，之後新增/刪除
    #     測試時務必記得回來改這一行）。
    name: 完整自動化測試（學生端 72 項 + 老師端 65 項）
    runs-on: ubuntu-latest
    steps:
      - name: 取得程式碼
        uses: actions/checkout@v4

      - name: 安裝 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 安裝測試套件相依套件
        working-directory: test-suite
        run: npm ci

      - name: 安裝 Playwright 瀏覽器（Chromium）
        working-directory: test-suite
        run: npx playwright install --with-deps chromium

      - name: 執行完整自動化測試（學生端 + 老師端，直接打正式環境）
        working-directory: test-suite
        env:
          FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
          TEST_STUDENT_EMAIL: ${{ secrets.TEST_STUDENT_EMAIL }}
          TEST_STUDENT_PASSWORD: ${{ secrets.TEST_STUDENT_PASSWORD }}
          TEST_TEACHER_EMAIL: ${{ secrets.TEST_TEACHER_EMAIL }}
          TEST_TEACHER_PASSWORD: ${{ secrets.TEST_TEACHER_PASSWORD }}
          HEADLESS: 'true'
        run: node run-tests.js

      - name: 上傳測試報告與失敗截圖（無論成功或失敗都保留）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: canary-report-${{ github.run_number }}
          path: |
            test-suite/test-report.txt
            test-suite/screenshots/
          retention-days: 14

      - name: 測試失敗時推送 Discord 通知
        if: failure()
        working-directory: test-suite
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: node notify-discord.js
