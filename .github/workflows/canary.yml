name: 完整自動化測試（學生端 + 老師端 Canary）

# 三個觸發時機：
#   1. push 到 main：部署後幾分鐘內就知道有沒有壞掉
#   2. schedule：每天固定時間跑一次，就算當天沒有改動也會檢查
#   3. workflow_dispatch：在 GitHub 網頁上手動按按鈕就能立刻跑一次
on:
  push:
    branches: [main]
  schedule:
    - cron: '0 0 * * *'  # 每天 UTC 00:00（台北時間早上 8:00）
  workflow_dispatch: {}

jobs:
  canary:
    # ⚠️ 下面「XX 項 + YY 項」是純說明文字，不會自動跟著 tests/*.test.js 的實際測試數同步，
    #    每次 student.test.js 或 teacher.test.js 新增/刪除測試時記得手動改這裡
    #    （目前對應 2026-08-05：student.test.js v26→v27（75→76 項，72個具名呼叫點 + 4次
    #     頁籤切換迴圈，新增 S-SEC-42）、teacher.test.js v26→v27（70→71 項，63個具名
    #     呼叫點 + 8次頁籤切換迴圈，新增 T-SEC-48），對應「薪資單照片可上傳多張」功能——
    #     原本月記只用單一 salaryPhoto Base64 字串，選新照片會直接覆蓋舊圖，改為
    #     salaryPhotos 陣列，最多5張、每張壓縮至800×600/JPEG quality 0.75、全部合計
    #     650,000字元硬上限（為 Firestore 單文件 1MiB 留安全餘裕）。薪資單仍留在受
    #     Firestore Rules 保護的月記文件內，不像工作照片改走公開 Cloudinary 路徑；
    #     getJournalSalaryPhotos() 學生端／老師端皆同時讀取新 salaryPhotos 與舊單張
    #     salaryPhoto 確保相容，學生重新儲存舊月記時會寫入新陣列並清空 salaryPhoto。
    #     S-SEC-42 驗證檔案 input 的 multiple、5張與650,000字元防呆、新舊格式相容、
    #     表單預覽、儲存 payload、歷史卡與 PDF；T-SEC-48 驗證老師端新舊格式相容、
    #     localStorage 同時剔除兩種 Base64、按需載入的多張渲染、月記卡與 PDF。
    #     rule.txt 不需變動——規則本身未以欄位白名單限制月記一般編輯，新欄位仍完全受
    #     既有「只能本人寫自己的 /users/{uid}/journals/」限制。完整技術細節見
    #     AI_CONTEXT.md 對應更新。
    #     此數字已連續在 2026-06-24／2026-07-03／2026-07-15／2026-07-18／2026-07-23／
    #     2026-07-25 過期六次，這是第七次，見 AI_推播系統說明.md 第六節 #9、
    #     AI_測試架構說明.md 第四節陷阱17，之後新增/刪除測試時務必記得回來改這一行）。
    name: 完整自動化測試（學生端 76 項 + 老師端 71 項）
    runs-on: ubuntu-latest
    steps:
      - name: 取得程式碼
        uses: actions/checkout@v4

      - name: 安裝 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 安裝測試套件相依套件
        working-directory: test-suite
        run: npm ci

      - name: 安裝 Playwright 瀏覽器（Chromium）
        working-directory: test-suite
        run: npx playwright install --with-deps chromium

      - name: 執行完整自動化測試（學生端 + 老師端，直接打正式環境）
        working-directory: test-suite
        env:
          FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
          TEST_STUDENT_EMAIL: ${{ secrets.TEST_STUDENT_EMAIL }}
          TEST_STUDENT_PASSWORD: ${{ secrets.TEST_STUDENT_PASSWORD }}
          TEST_TEACHER_EMAIL: ${{ secrets.TEST_TEACHER_EMAIL }}
          TEST_TEACHER_PASSWORD: ${{ secrets.TEST_TEACHER_PASSWORD }}
          HEADLESS: 'true'
        run: node run-tests.js

      - name: 上傳測試報告與失敗截圖（無論成功或失敗都保留）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: canary-report-${{ github.run_number }}
          path: |
            test-suite/test-report.txt
            test-suite/screenshots/
          retention-days: 14

      - name: 測試失敗時推送 Discord 通知
        if: failure()
        working-directory: test-suite
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: node notify-discord.js
