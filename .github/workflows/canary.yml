name: 完整自動化測試（學生端 + 老師端 Canary）

# 三個觸發時機：
#   1. push 到 main：部署後幾分鐘內就知道有沒有壞掉
#   2. schedule：每天固定時間跑一次，就算當天沒有改動也會檢查
#   3. workflow_dispatch：在 GitHub 網頁上手動按按鈕就能立刻跑一次
on:
  push:
    branches: [main]
  schedule:
    - cron: '0 0 * * *'  # 每天 UTC 00:00（台北時間早上 8:00）
  workflow_dispatch: {}

jobs:
  canary:
    # 2026-08-16 起 job 名稱不再放測試數字——這個數字過去連續 9 次因為忘記手動同步而
    # 過期（完整記錄見 AI_測試架構說明.md 第四節陷阱17）。真正的數字現在完全由
    # run-tests.js 在執行當下動態算出，並寫進這次執行的 GitHub Job Summary（在
    # Actions 該次執行頁面的「Summary」分頁，不用點進 log 就看得到），永遠反映
    # 「這次真的跑出來的結果」，不再需要也不應該手動維護在這裡。
    name: 完整自動化測試（學生端 + 老師端）
    runs-on: ubuntu-latest
    steps:
      - name: 取得程式碼
        uses: actions/checkout@v4

      - name: 安裝 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 安裝測試套件相依套件
        working-directory: test-suite
        run: npm ci

      - name: 安裝 Playwright 瀏覽器（Chromium）
        working-directory: test-suite
        run: npx playwright install --with-deps chromium

      - name: 執行完整自動化測試（學生端 + 老師端，直接打正式環境）
        working-directory: test-suite
        env:
          FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
          TEST_STUDENT_EMAIL: ${{ secrets.TEST_STUDENT_EMAIL }}
          TEST_STUDENT_PASSWORD: ${{ secrets.TEST_STUDENT_PASSWORD }}
          TEST_TEACHER_EMAIL: ${{ secrets.TEST_TEACHER_EMAIL }}
          TEST_TEACHER_PASSWORD: ${{ secrets.TEST_TEACHER_PASSWORD }}
          HEADLESS: 'true'
        run: node run-tests.js

      - name: 上傳測試報告與失敗截圖（無論成功或失敗都保留）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: canary-report-${{ github.run_number }}
          path: |
            test-suite/test-report.txt
            test-suite/screenshots/
          retention-days: 14

      - name: 測試失敗時推送 Discord 通知
        if: failure()
        working-directory: test-suite
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: node notify-discord.js
