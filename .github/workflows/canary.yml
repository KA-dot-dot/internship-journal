name: 完整自動化測試（學生端 + 老師端 Canary）

# 三個觸發時機：
#   1. push 到 main：部署後幾分鐘內就知道有沒有壞掉
#   2. schedule：每天固定時間跑一次，就算當天沒有改動也會檢查
#   3. workflow_dispatch：在 GitHub 網頁上手動按按鈕就能立刻跑一次
on:
  push:
    branches: [main]
  schedule:
    - cron: '0 0 * * *'  # 每天 UTC 00:00（台北時間早上 8:00）
  workflow_dispatch: {}

jobs:
  canary:
    # ⚠️ 下面「XX 項 + YY 項」是純說明文字，不會自動跟著 tests/*.test.js 的實際測試數同步，
    #    每次 student.test.js 或 teacher.test.js 新增/刪除測試時記得手動改這裡
    #    （目前對應 2026-08-08：student.test.js v27→v28（76→77 項，73個具名呼叫點 + 4次
    #     頁籤切換迴圈，新增 S-SEC-43）、teacher.test.js v27→v28（71→72 項，64個具名
    #     呼叫點 + 8次頁籤切換迴圈，新增 T-SEC-49），對應「刪除操作二次確認」功能——
    #     deleteStudent()／單筆刪月記／批次刪月記共5處「無法復原」的刪除流程，新增輸入
    #     姓名或 DELETE {筆數} 才能執行刪除的第二層確認，源自使用者指出這批操作完全沒有
    #     任何復原機制（真刪除，無回收站）。deleteStudent() 從 confirm() 改成單一
    #     prompt()（警告文字＋姓名輸入合併同一段）；4個既有 Modal（老師/學生 × 單筆/
    #     批次）皆補上輸入框，按下確認鍵才檢查，不符合就 toast 錯誤且不關閉 Modal，跟
    #     deleteSelectedSemesterData() 既有的 prompt()+info toast 機制刻意不同（4個
    #     Modal 本來就是既有介面，只是延續各自原有的互動模式各自加一道輸入關卡）。
    #     單筆刪月記要求輸入該生姓名（teacher.html 用呼叫端傳入的 studentName 參數；
    #     student.html 刻意改用 currentUser?.name，避免月記存的舊姓名跟名冊事後更正
    #     不同步造成學生打自己現在的名字卻被判定不符）；批次刪月記／批次刪歷史月記因
    #     可能橫跨多位學生（尤其老師端），改要求輸入 DELETE {筆數}。rule.txt 不需變動
    #     ——全部是前端確認流程，Firestore 讀寫本身沒有變化。完整技術細節見 AI_CONTEXT.md
    #     對應更新。
    #     此數字已連續在 2026-06-24／2026-07-03／2026-07-15／2026-07-18／2026-07-23／
    #     2026-07-25 過期六次，2026-08-05 第七次，這是第八次，見 AI_推播系統說明.md
    #     第六節 #9、AI_測試架構說明.md 第四節陷阱17，之後新增/刪除測試時務必記得回來
    #     改這一行）。
    name: 完整自動化測試（學生端 77 項 + 老師端 72 項）
    runs-on: ubuntu-latest
    steps:
      - name: 取得程式碼
        uses: actions/checkout@v4

      - name: 安裝 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 安裝測試套件相依套件
        working-directory: test-suite
        run: npm ci

      - name: 安裝 Playwright 瀏覽器（Chromium）
        working-directory: test-suite
        run: npx playwright install --with-deps chromium

      - name: 執行完整自動化測試（學生端 + 老師端，直接打正式環境）
        working-directory: test-suite
        env:
          FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
          TEST_STUDENT_EMAIL: ${{ secrets.TEST_STUDENT_EMAIL }}
          TEST_STUDENT_PASSWORD: ${{ secrets.TEST_STUDENT_PASSWORD }}
          TEST_TEACHER_EMAIL: ${{ secrets.TEST_TEACHER_EMAIL }}
          TEST_TEACHER_PASSWORD: ${{ secrets.TEST_TEACHER_PASSWORD }}
          HEADLESS: 'true'
        run: node run-tests.js

      - name: 上傳測試報告與失敗截圖（無論成功或失敗都保留）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: canary-report-${{ github.run_number }}
          path: |
            test-suite/test-report.txt
            test-suite/screenshots/
          retention-days: 14

      - name: 測試失敗時推送 Discord 通知
        if: failure()
        working-directory: test-suite
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: node notify-discord.js
